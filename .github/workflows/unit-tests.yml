name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --tests "com.adbpair.core.PairingStateMachineTest" --tests "com.adbpair.core.FailureClassifierTest" --tests "com.adbpair.core.AdbIdentityTest" --tests "com.adbpair.core.PortChainTest" --tests "com.adbpair.core.DiagnosticsLogTest" --tests "com.adbpair.core.PortDiscoveryTest"
      - name: Print per-test summary
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          total = failures = errors = skipped = 0
          for path in sorted(glob.glob('app/build/test-results/testDebugUnitTest/*.xml')):
              root = ET.parse(path).getroot()
              total += int(root.get('tests', 0))
              failures += int(root.get('failures', 0))
              errors += int(root.get('errors', 0))
              skipped += int(root.get('skipped', 0))
              for case in root.iter('testcase'):
                  status = 'ok'
                  if case.find('failure') is not None:
                      status = 'FAILED'
                  elif case.find('error') is not None:
                      status = 'ERROR'
                  elif case.find('skipped') is not None:
                      status = 'skipped'
                  print(f"  {status} {case.get('classname')}.{case.get('name')}")
          print(f"TOTAL: tests={total} failures={failures} errors={errors} skipped={skipped}")
          EOF
