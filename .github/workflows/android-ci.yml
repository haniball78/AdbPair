name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # No setup-android step: the runner's preinstalled SDK is used (AGP reads ANDROID_HOME). setup-android@v3 fails here — it installs the removed `tools` package.
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: adbpair-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
